[project]
name = "rag-mcp-server"
version = "0.1.0"
description = "Standalone MCP server exposing the rag-knowledge-base read-only tools to any MCP client"
authors = [
    { name = "jacky", email = "mikehot668@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.0",
]

[project.scripts]
rag-mcp-server = "rag_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
