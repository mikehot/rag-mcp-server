[project]
name = "rag-mcp-server"
version = "0.2.0"
description = "Standalone MCP server exposing the rag-knowledge-base read-only tools to any MCP client"
authors = [
    { name = "jacky", email = "mikehot668@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
rag-mcp-server = "rag_mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.21",
    "ruff>=0.17.6,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
